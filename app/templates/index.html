 {% extends "base.html" %}

 
{% block title %}
    Spike FastAPI + HTMX + Alpine
{% endblock title %}

{% block content %}    <!-- Ejemplo Alpine -->
        <div class="mb-4 text-center">
            <span class="text-lg">Contador: <strong x-text="count"></strong></span>
            <button @click="count++" 
                    class="ml-2 px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">
                +
            </button>
        </div>

        <!-- Ejemplo HTMX -->
        <div id="resultado" class="p-4 bg-gray-50 rounded text-center text-gray-600">
            Pulsa el botón para cargar contenido del servidor
        </div>
        <button hx-get="/api/saludo"
                hx-target="#resultado"
                hx-swap="innerHTML"
                class="mt-4 w-full py-2 bg-green-500 text-white rounded hover:bg-green-600">
            Cargar desde FastAPI
        </button>
{% endblock content %}
