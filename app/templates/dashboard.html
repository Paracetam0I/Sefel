{% extends "base.html" %}

{% block title %}Dashboard{% endblock title %}

{% block content %}
<h1 class="text-2xl font-bold text-sefel-black">Hola, {{ usuario.full_name }}</h1>
<p class="mt-1 text-neutral-500">Resumen general de la operación.</p>

<div class="mt-8 grid gap-6 sm:grid-cols-2 xl:grid-cols-4">
    {% for titulo in ["Proyectos", "Estructuras", "Mantenimiento", "Clientes"] %}
    <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-neutral-500">{{ titulo }}</p>
        <p class="mt-2 text-3xl font-bold text-sefel-black">—</p>
    </div>
    {% endfor %}
</div>
{% endblock content %}
