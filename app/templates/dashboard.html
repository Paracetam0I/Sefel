{% extends "base.html" %}

{% block title %}Dashboard{% endblock title %}

{% block body %}
<div class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">
        Hola, {{ usuario.full_name }}
    </h1>
    <p class="text-gray-600 mb-6">Rol: {{ usuario.role.value }}</p>

    <form method="post" action="/logout">
        <button type="submit"
                class="w-full py-2 bg-red-500 text-white rounded hover:bg-red-600">
            Cerrar sesión
        </button>
    </form>
</div>
{% endblock body %}
