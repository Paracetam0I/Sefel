{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock title %}

{% block body %}
<div class="bg-white p-8 rounded-xl shadow-lg w-96">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">
        Iniciar sesión
    </h1>

    {% if error %} <!-- Mostrar mensaje de error si existe -->
    <div class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                Usuario
            </label>
            <input type="text" id="username" name="username"
                required autofocus autocomplete="username"
                class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                Contraseña
            </label>
            <!-- Campo de contraseña con tipo "password" para ocultar la entrada del usuario -->
            <input type="password" id="password" name="password"
                required autocomplete="current-password"
                class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"> 
        </div>

        <button type="submit"
                class="w-full py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Entrar
        </button>
    </form>
</div>
{% endblock body %}
