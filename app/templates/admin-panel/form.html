{% extends "base.html" %}
{% block content %}
  <h1>{{ "Editar usuario" if modo == "editar" else "Nuevo usuario" }}</h1>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post"
        action="{{ '/admin/users/' ~ usuario.id ~ '/edit' if modo == 'editar' else '/admin/users' }}">
    <label>Username <input name="username" value="{{ usuario.username if usuario else '' }}" required></label>
    <label>Email    <input name="email"    value="{{ usuario.email    if usuario else '' }}" required type="email"></label>

    {% if modo == "crear" %}
      <label>Contraseña <input name="password" type="password" required></label>
    {% endif %}

    <label>Rol
      <select name="role">
        <option value="admin" {% if usuario and usuario.role.value == "admin" %}selected{% endif %}>Admin</option>
        <option value="user"  {% if usuario and usuario.role.value == "user"  %}selected{% endif %}>Usuario</option>
      </select>
    </label>

    <button type="submit">Guardar</button>
    <a href="/admin/users">Cancelar</a>
  </form>
{% endblock %}
