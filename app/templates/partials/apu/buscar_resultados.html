{% if apus %}
<ul class="divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white shadow-sm" role="listbox">
    {% for a in apus %}
    {# Costo calculado con la receta del APU #}
    {% set costo = costos.get(a.id, costo_vacio) %}
    <li role="option">
        <button
            type="button"
            class="flex w-full items-center justify-between gap-4 px-3 py-2 text-left text-sm hover:bg-gray-50"
            hx-get="/api/apu/{{ a.id }}/autocompletar"
            hx-target="#campos-apu"
            hx-swap="innerHTML"
        >
            <span>
                <span class="font-semibold">{{ a.code }}</span> · {{ a.name }}
            </span>
            <span class="text-right text-gray-500">
                {% if costo.recursos %}
                    {{ costo.unit_cost|clp }} / {{ a.unit }}
                    <span class="block text-xs">Real: {{ costo.real_unit_cost|clp }}</span>
                {% else %}
                    <span class="text-red-700">Sin recursos</span>
                {% endif %}
            </span>
        </button>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="px-3 py-2 text-sm text-gray-500">
    Sin resultados{% if q %} para «{{ q }}»{% endif %}.
</p>
{% endif %}
