<input type="hidden" name="id_apu" value="{{ apu.id }}">

<p class="mb-4 text-sm text-gray-500">
    APU seleccionado:
    <span class="font-semibold">{{ apu.code }} · {{ apu.name }}</span>
</p>

<div class="grid grid-cols-1 gap-5 sm:grid-cols-3">
    <div>
        <label for="unit" class="label">Unidad</label>
        <input
            id="unit"
            name="unit"
            type="text"
            value="{{ datos.unit if datos else apu.unit }}"
            maxlength="30"
            required
            class="field w-full"
        >
    </div>

    <div>
        <label for="estimated_unit_cost" class="label">Costo cotizado unitario (CLP)</label>
        <input
            id="estimated_unit_cost"
            name="estimated_unit_cost"
            type="number"
            value="{{ datos.estimated_unit_cost if datos else apu.unit_cost }}"
            min="0"
            step="1"
            required
            class="field w-full"
        >
    </div>

    <div>
        <label for="real_unit_cost" class="label">Costo real unitario (CLP)</label>
        <input
            id="real_unit_cost"
            name="real_unit_cost"
            type="number"
            value="{{ datos.real_unit_cost if datos else apu.real_unit_cost }}"
            min="0"
            step="1"
            class="field w-full"
            placeholder="Igual al cotizado si se deja vacío"
        >
    </div>
</div>
