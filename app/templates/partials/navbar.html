<header class="flex h-14 shrink-0 items-center justify-between border-b border-gray-200 bg-white px-3.5 shadow-sm">

    {# Logo: coloca la imagen en app/static/img/logo_sefel.png #}
    <a href="/dashboard" class="flex items-center gap-3">
        <img src="/static/img/logo_sefel.png" alt="SEFEL" class="h-8 w-auto">
        <div class="leading-tight">
            <div class="text-xl font-extrabold tracking-tight text-sefel-black">SEFEL</div>
            <div class="text-[11px] font-medium uppercase tracking-[0.15em] text-neutral-500">
                Ingeniería &amp; Construcción
            </div>
        </div>
    </a>

    {# Menú de usuario #}
    <div class="relative" x-data="{ abierto: false }" @click.outside="abierto = false" @keydown.escape.window="abierto = false">
        <button type="button"
                @click="abierto = !abierto"
                :aria-expanded="abierto"
                class="flex items-center gap-2.5 rounded-lg px-2 py-1 hover:bg-gray-50">
            <span class="flex size-8 items-center justify-center rounded-full bg-sefel-red text-sm font-bold text-white">
                {{ (usuario.full_name.split()[:2] | map('first') | join | upper) if usuario else "?" }}
            </span>
            <span class="font-semibold">{{ usuario.full_name if usuario else "Invitado" }}</span>
            <svg class="size-4 text-neutral-400 transition-transform" :class="abierto && 'rotate-180'"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"/>
            </svg>
        </button>

        <div x-show="abierto" x-cloak x-transition.opacity
             class="absolute right-0 z-20 mt-2 w-48 rounded-lg border border-gray-200 bg-white py-1 shadow-lg">
            {% if usuario %}
            <div class="border-b border-gray-100 px-4 py-2 text-xs text-neutral-500">
                {{ usuario.role.value }}
            </div>
            {% endif %}
            <form method="post" action="/logout">
                <button type="submit"
                        class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</header>
