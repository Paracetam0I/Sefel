{% if materiales %}
<ul class="divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white shadow-sm" role="listbox">
    {% for m in materiales %}
    <li role="option">
        <button
            type="button"
            class="flex w-full items-center justify-between gap-4 px-3 py-2 text-left text-sm hover:bg-gray-50"
            hx-get="/api/materiales/{{ m.id }}/autocompletar"
            hx-target="#campos-material"
            hx-swap="innerHTML"
        >
            <span>
                <span class="font-semibold">{{ m.code }}</span> · {{ m.name }}
            </span>
            <span class="text-gray-500">{{ m.unit_cost|clp }} / {{ m.unit }}</span>
        </button>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="px-3 py-2 text-sm text-gray-500">
    Sin resultados{% if q %} para «{{ q }}»{% endif %}.
</p>
{% endif %}
