<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike FastAPI + HTMX + Alpine</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/alpine.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-96" x-data="{ count: 0 }">
        <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">
            Spike funcionando 🎉
        </h1>

        <!-- Ejemplo Alpine -->
        <div class="mb-4 text-center">
            <span class="text-lg">Contador: <strong x-text="count"></strong></span>
            <button @click="count++" 
                    class="ml-2 px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">
                +
            </button>
        </div>

        <!-- Ejemplo HTMX -->
        <div id="resultado" class="p-4 bg-gray-50 rounded text-center text-gray-600">
            Pulsa el botón para cargar contenido del servidor
        </div>
        <button hx-get="/api/saludo"
                hx-target="#resultado"
                hx-swap="innerHTML"
                class="mt-4 w-full py-2 bg-green-500 text-white rounded hover:bg-green-600">
            Cargar desde FastAPI
        </button>
    </div>
</body>
</html>
